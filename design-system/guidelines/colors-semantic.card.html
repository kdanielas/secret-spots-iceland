<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.r{display:flex;gap:8px;align-items:center;font:var(--type-body-sm)}.k{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink-900)}.d{width:22px;height:22px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px">
<div class="r"><span class="d" style="background:var(--surface-page)"></span><span class="k">--surface-page</span></div>
<div class="r"><span class="d" style="background:var(--surface-card)"></span><span class="k">--surface-card</span></div>
<div class="r"><span class="d" style="background:var(--surface-dark)"></span><span class="k">--surface-dark</span></div>
<div class="r"><span class="d" style="background:var(--surface-dark-panel)"></span><span class="k">--surface-dark-panel</span></div>
<div class="r"><span class="d" style="background:var(--action-primary-bg)"></span><span class="k">--action-primary-bg</span></div>
<div class="r"><span class="d" style="background:var(--action-dark-bg)"></span><span class="k">--action-dark-bg</span></div>
<div class="r"><span class="d" style="background:var(--text-eyebrow)"></span><span class="k">--text-eyebrow</span></div>
<div class="r"><span class="d" style="background:var(--text-heading)"></span><span class="k">--text-heading</span></div>
</div></body></html>
