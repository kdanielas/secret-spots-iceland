<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.x{flex:1;display:flex;flex-direction:column;gap:8px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}.s{height:66px;border-radius:var(--radius-card);background:var(--cream-50)}</style></head><body>
<div style="display:flex;gap:18px">
<div class="x"><div class="s" style="box-shadow:var(--shadow-none);border:1px solid var(--border-subtle)"></div>--shadow-none (default)</div>
<div class="x"><div class="s" style="box-shadow:var(--shadow-card)"></div>--shadow-card (hover)</div>
<div class="x"><div class="s" style="box-shadow:var(--shadow-float)"></div>--shadow-float</div>
<div class="x"><div class="s" style="box-shadow:var(--shadow-bar)"></div>--shadow-bar (fact bar)</div>
</div></body></html>
