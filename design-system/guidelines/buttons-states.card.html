<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.b{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 24px;border-radius:var(--radius-pill);font:var(--type-button)}.l{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--text-muted);margin-top:6px}.col{display:flex;flex-direction:column;align-items:flex-start}</style></head><body>
<div style="display:flex;gap:16px;flex-wrap:wrap">
<div class="col"><span class="b" style="background:var(--amber-400);color:var(--espresso-900)">Check Availability</span><span class="l">default</span></div>
<div class="col"><span class="b" style="background:var(--amber-500);color:var(--espresso-900)">Check Availability</span><span class="l">hover</span></div>
<div class="col"><span class="b" style="background:var(--amber-500);color:var(--espresso-900);transform:scale(.985)">Check Availability</span><span class="l">press</span></div>
<div class="col"><span class="b" style="background:var(--amber-400);color:var(--espresso-900);opacity:.45">Check Availability</span><span class="l">disabled</span></div>
</div></body></html>
