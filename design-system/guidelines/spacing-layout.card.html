<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.l{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}</style></head><body>
<div style="background:var(--sand-200);border-radius:var(--radius-md);padding:14px">

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--grid-gap);margin-top:12px">

  </div>
  <div class="l" style="margin-top:10px">--grid-gap: 24px · 4-up tour grid · 2-up wide grid · 12-col text pairs</div>
</div></body></html>
